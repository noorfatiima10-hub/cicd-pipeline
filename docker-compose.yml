# =============================================================
# docker-compose.yml — Local testing environment
# Simulates the production stack on your laptop.
# Usage: docker compose up --build
# =============================================================

version: "3.9"

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cicd-demo-app
    ports:
      - "5000:5000"
    environment:
      - APP_VERSION=local-dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional: lightweight reverse proxy to simulate port 80/443
  nginx:
    image: nginx:alpine
    container_name: cicd-demo-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
